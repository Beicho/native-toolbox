name: OnThisDay Data

# 抓取维基百科中文「历史上的今天」全年数据进仓库(历史数据基本不变,跑一次管很久)
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch full year data
        run: node scripts/fetch-onthisday.mjs

      # 即使抓取步骤中途失败，也把已抓到的天数提交，下次重跑增量补齐
      - name: Commit data
        if: always()
        run: |
          git config user.name "Beicho"
          git config user.email "beicho@users.noreply.github.com"
          git add server/data/onthisday
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "data: 历史上的今天全年数据(维基百科中文) [skip ci]"
          # 抓取要跑十几分钟，期间 main 上很可能已经有新提交，
          # 直接 push 会被 fetch-first 拒绝导致数据白抓。先 rebase 再推，并重试几次。
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "推送第 $i 次失败，等 10 秒重试"
            sleep 10
          done
          echo "推送始终失败"
          exit 1
