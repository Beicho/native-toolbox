name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (如 v0.3.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Install Android platform 37.0
      run: |
        SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
        yes | "$SDKMANAGER" --licenses > /dev/null || true
        yes | "$SDKMANAGER" "platforms;android-37.0" "build-tools;36.0.0" > /dev/null

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Restore release keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

    - name: Build Release APK (signed)
      env:
        RELEASE_STORE_FILE: ${{ runner.temp }}/release.jks
        RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        chmod +x gradlew
        ./gradlew assembleRelease --stacktrace
        # ABI 分包后有多个产物:universal 作为主发布包,arm64 单独附上(更小)
        TAG="${{ github.event.inputs.tag }}"
        cp app/build/outputs/apk/release/*universal*.apk "AstroKit-${TAG}.apk"
        ARM64=$(ls app/build/outputs/apk/release/*arm64*.apk 2>/dev/null | head -1)
        [ -n "$ARM64" ] && cp "$ARM64" "AstroKit-${TAG}-arm64.apk" || true

    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        TAG="${{ github.event.inputs.tag }}"
        NOTES="docs/release-notes-${TAG}.md"
        if [ ! -f "$NOTES" ]; then echo "release notes 文件缺失: $NOTES"; exit 1; fi
        ASSETS="AstroKit-${TAG}.apk"
        [ -f "AstroKit-${TAG}-arm64.apk" ] && ASSETS="$ASSETS AstroKit-${TAG}-arm64.apk"
        gh release create "$TAG" $ASSETS \
          --title "Astro Kit ${TAG}" \
          --notes-file "$NOTES"
