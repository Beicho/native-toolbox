name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    # 使用 runner 预装 SDK,补装 API 37.0 平台(preview 许可自动接受)
    - name: Install Android platform 37.0
      run: |
        SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
        yes | "$SDKMANAGER" --licenses > /dev/null || true
        yes | "$SDKMANAGER" "platforms;android-37.0" "build-tools;36.0.0" > /dev/null
        ls "$ANDROID_HOME/platforms/"
        ls "$ANDROID_HOME/platforms"/android-37*/package.xml || echo "NO package.xml"

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Build Debug APK
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace

    # debug 包不做代码压缩也不裁资源，体积会到 70MB 以上，装机用的应该是 release 包。
    # release 开了 R8 + 资源裁剪，能把没用到的图标资源全部剔掉。
    - name: Build Release APK
      run: ./gradlew assembleRelease --stacktrace

    - name: Show APK sizes
      run: |
        echo "各产物体积："
        ls -lh app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk 2>/dev/null | awk '{print $5, $9}'

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: astrokit-apk
        path: |
          app/build/outputs/apk/release/*.apk
          app/build/outputs/apk/debug/*.apk
        retention-days: 7
